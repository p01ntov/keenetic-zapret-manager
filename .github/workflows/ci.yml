name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run tests in an isolated Linux container
        run: |
          docker run --rm --privileged \
            -v "$PWD:/work" \
            -w /work \
            ubuntu:24.04 \
            sh -lc 'sh tests/run.sh && sh tests/install-upgrade.sh && sh tests/components.sh && sh tests/bootstrap.sh'
