name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run core tests
        run: sh tests/run.sh

      - name: Run installer upgrade tests
        run: sh tests/install-upgrade.sh

      - name: Run component tests
        run: sh tests/components.sh
