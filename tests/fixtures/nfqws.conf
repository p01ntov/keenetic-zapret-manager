ISP_INTERFACE="ppp0"

NFQWS_ARGS="--dpi-desync=fake"
NFQWS_ARGS_QUIC="--filter-udp=443 --dpi-desync=fake"
NFQWS_ARGS_UDP=""

MODE_LIST="--hostlist=/opt/etc/nfqws/user.list"
MODE_ALL="--hostlist-exclude=/opt/etc/nfqws/exclude.list"
MODE_AUTO="$MODE_LIST --hostlist-auto=/opt/etc/nfqws/auto.list $MODE_ALL"
NFQWS_EXTRA_ARGS="$MODE_AUTO"
NFQWS_ARGS_IPSET="--ipset=/opt/etc/nfqws/ipset.list"
NFQWS_ARGS_CUSTOM=""

IPV6_ENABLED=0
TCP_PORTS=443
UDP_PORTS=443
POLICY_NAME="nfqws"
POLICY_EXCLUDE=0
LOG_LEVEL=0
NFQUEUE_NUM=200
USER=nobody
CONFIG_VERSION=8
